<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#263b84" />
    <title>NOJIMA TOOL HUB</title>
    <style>
      :root {
        --blue: #263b84;
        --blue-deep: #1e306c;
        --red: #e52332;
        --ink: #19243a;
        --muted: #778196;
        --line: #e6eaf1;
        --paper: #ffffff;
        --canvas: #f5f7fb;
        --shadow: 0 18px 50px rgba(23, 45, 88, 0.1);
        --radius: 18px;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--canvas);
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Yu Gothic", Meiryo, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #fff;
        background: radial-gradient(circle at 50% 42%, #3155a1, #102d68 65%);
        transition:
          opacity 0.7s ease,
          visibility 0.7s ease;
      }
      .boot::before,
      .boot::after {
        content: "";
        position: absolute;
        width: 54vw;
        aspect-ratio: 1;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 50%;
        animation: orbit 9s linear infinite;
      }
      .boot::after {
        width: 76vw;
        animation-direction: reverse;
      }
      .boot.done {
        opacity: 0;
        visibility: hidden;
      }
      .boot-inner {
        z-index: 1;
        text-align: center;
        animation: rise 0.8s both;
      }
      .boot-logo {
        width: min(68vw, 310px);
        height: auto;
        object-fit: contain;
        animation: logoZoom 2.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .boot-caption {
        margin-top: 25px;
        font-size: 12px;
        letter-spacing: 0.16em;
        color: rgba(255, 255, 255, 0.68);
      }
      .boot-caption::after {
        content: "";
        animation: dots 1.4s steps(4, end) infinite;
      }
      @keyframes logoZoom {
        0% {
          opacity: 0;
          transform: scale(0.66);
        }
        25% {
          opacity: 1;
        }
        78% {
          transform: scale(1.04);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes rise {
        from {
          transform: translateY(15px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      @keyframes orbit {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes dots {
        0% {
          content: "";
        }
        25% {
          content: ".";
        }
        50% {
          content: "..";
        }
        75%,
        100% {
          content: "...";
        }
      }
      .shell {
        min-height: 100vh;
      }
      .topbar {
        height: 76px;
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 0 34px;
        background: #263b84;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(16px);
        color: #fff;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 13px;
        text-decoration: none;
        color: inherit;
        min-width: 215px;
        padding: 8px 12px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.08);
      }
      .brand img {
        display: block;
        width: 116px;
        max-height: 40px;
        object-fit: contain;
      }
      .brand-divider {
        width: 1px;
        height: 25px;
        background: rgba(255, 255, 255, 0.38);
      }
      .brand-name {
        font-size: 11px;
        letter-spacing: 0.14em;
        color: #fff;
        font-weight: 700;
      }
      .top-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        color: rgba(255, 255, 255, 0.88);
        font-size: 12px;
        font-weight: 650;
      }
      .status-dot {
        flex: 0 0 auto;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ffd166;
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.17);
      }
      .status-dot[data-state="online"] {
        background: #51d39a;
      }
      .status-dot[data-state="syncing"] {
        background: #ffd166;
      }
      .status-dot[data-state="offline"] {
        background: #ff737b;
      }
      .layout {
        display: grid;
        grid-template-columns: 252px minmax(0, 1fr);
        max-width: 1500px;
        min-height: calc(100vh - 76px);
        margin: auto;
      }
      .sidebar {
        display: flex;
        flex-direction: column;
        padding: 34px 20px 24px 28px;
        border-right: 1px solid var(--line);
      }
      .side-kicker {
        margin: 0 0 14px 12px;
        color: #9aa3b2;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.16em;
      }
      .nav-list {
        display: grid;
        gap: 5px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 46px;
        padding: 0 13px;
        border: 0;
        border-radius: 12px;
        color: #657188;
        background: transparent;
        text-align: left;
        transition: 0.2s;
      }
      .nav-item:hover {
        color: var(--blue);
        background: #edf2fb;
      }
      .nav-item.active {
        color: var(--blue);
        background: #eaf0fc;
        font-weight: 750;
      }
      .nav-icon {
        display: grid;
        place-items: center;
        width: 25px;
        height: 25px;
        border-radius: 8px;
        background: #fff;
        color: var(--blue);
        font-size: 13px;
      }
      .nav-count {
        margin-left: auto;
        font-size: 11px;
        color: #9aa3b2;
      }
      .nav-icon {
        overflow: hidden;
        background: transparent;
      }
      .nav-icon img {
        display: block;
        width: 25px;
        height: 25px;
        object-fit: contain;
      }
      .sidebar-bottom {
        margin-top: auto;
        padding-top: 24px;
      }
      .add-button {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 9px;
        width: 100%;
        height: 48px;
        border: 0;
        border-radius: 13px;
        color: #fff;
        background: var(--blue);
        font-weight: 700;
        box-shadow: 0 8px 20px #173b8429;
        transition:
          transform 0.2s,
          background 0.2s,
          box-shadow 0.2s;
      }
      .add-button:hover {
        background: var(--blue-deep);
        transform: translateY(-2px);
        box-shadow: 0 12px 24px #173b8438;
      }
      .local-note {
        margin: 15px 4px 0;
        color: #9aa3b2;
        font-size: 10px;
        line-height: 1.7;
      }
      .content {
        min-width: 0;
        padding: 45px clamp(22px, 5vw, 72px) 72px;
      }
      .hero {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: flex-end;
        margin-bottom: 10px;
      }
      .eyebrow {
        margin: 0 0 11px;
        color: var(--red);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.18em;
      }
      .eyebrow.notice {
        margin: 0;
        padding: 16px 19px;
        border: 1px solid #f0d7d9;
        border-radius: 13px;
        background: #fff4f3;
        color: #9b3940;
        font-size: clamp(13px, 1.3vw, 16px);
        font-weight: 750;
        letter-spacing: 0;
      }
      h1 {
        margin: 0;
        font-size: clamp(28px, 3.7vw, 43px);
        letter-spacing: -0.045em;
        line-height: 1.18;
      }
      .hero-desc {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 14px;
      }
      .hero-mark {
        display: none;
        color: #dce4f2;
        font-size: 72px;
        line-height: 0.8;
        font-weight: 900;
      }
      .search-wrap {
        position: relative;
        margin-bottom: 27px;
      }
      .search-icon {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: #8792a6;
        font-size: 17px;
        pointer-events: none;
      }
      .search {
        width: 100%;
        height: 58px;
        padding: 0 18px 0 49px;
        outline: 0;
        border: 1px solid #e2e7ef;
        border-radius: 15px;
        background: #fff;
        box-shadow: 0 5px 18px rgba(24, 44, 82, 0.035);
        transition: 0.2s;
      }
      .search:focus {
        border-color: #7894cf;
        box-shadow: 0 0 0 4px #163c8913;
      }
      .search::placeholder {
        color: #a0a8b5;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 14px;
      }
      .results-title {
        font-size: 13px;
        font-weight: 750;
      }
      .results-sub {
        margin-left: 8px;
        color: #9aa3b2;
        font-size: 12px;
        font-weight: 500;
      }
      .sort-select {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 8px 10px;
        background: #fff;
        color: #68758b;
        font-size: 11px;
        outline: 0;
      }
      .list {
        display: grid;
        gap: 11px;
      }
      .tool-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(360px, 0.95fr);
        align-items: center;
        gap: 20px;
        min-height: 112px;
        padding: 18px 20px;
        border: 1px solid #e9edf3;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 4px 14px rgba(22, 42, 79, 0.025);
        transition:
          transform 0.2s,
          box-shadow 0.2s,
          border-color 0.2s;
        animation: cardIn 0.35s both;
      }
      .tool-card:hover {
        transform: translateY(-2px);
        border-color: #d3ddef;
        box-shadow: var(--shadow);
      }
      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(9px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .tool-main {
        display: grid;
        gap: 11px;
        min-width: 0;
      }
      .tool-title-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .type-icon {
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        width: 37px;
        height: 37px;
        border-radius: 11px;
        background: #edf2fb;
        color: var(--blue);
        font-size: 12px;
        font-weight: 850;
      }
      .tool-title {
        overflow: hidden;
        font-size: 15px;
        font-weight: 750;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tool-kind {
        color: #97a0af;
        font-size: 11px;
        white-space: nowrap;
      }
      .tool-meta {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 12px;
        color: #8691a3;
        font-size: 11px;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        padding: 5px 9px;
        border-radius: 7px;
        background: #f1f4f8;
        color: #58657b;
        font-size: 10px;
        font-weight: 750;
      }
      .date {
        white-space: nowrap;
      }
      .card-actions {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        width: 100%;
      }
      .action {
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        vertical-align: middle;
        line-height: 1.25;
        min-height: 34px;
        padding: 0 6px;
        border: 1px solid transparent;
        border-radius: 9px;
        background: #f0f3fb;
        color: #344b82;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap;
        transition: 0.18s;
        text-decoration: none;
      }
      .action:hover {
        border-color: #d3dbee;
        color: #223b78;
        background: #e7edf9;
      }
      .action.primary {
        border-color: #dce4f5;
        background: #e8eefb;
        color: #263b84;
      }
      .action.primary:hover {
        background: #dce6f8;
      }
      .action[data-action="edit"] {
        border-color: #e6dff6;
        background: #f1ecfb;
        color: #66528d;
      }
      .action[data-action="preview"] {
        border-color: #d8ece7;
        background: #eaf6f2;
        color: #397866;
      }
      .action[data-action="share"] {
        border-color: #f2e5cb;
        background: #fff5e5;
        color: #8a6b32;
      }
      .action[data-action="open"] {
        border-color: #dae4f4;
        background: #e9f1fb;
        color: #365b91;
      }
      .empty {
        display: none;
        padding: 66px 22px;
        text-align: center;
        border: 1px dashed #dce2ec;
        border-radius: 18px;
        background: #fbfcfe;
      }
      .empty.show {
        display: block;
        animation: cardIn 0.35s both;
      }
      .empty-icon {
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        margin: 0 auto 15px;
        border-radius: 17px;
        background: #edf2fb;
        color: var(--blue);
        font-size: 22px;
      }
      .empty h2 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      .empty p {
        max-width: 420px;
        margin: auto;
        color: #8791a2;
        font-size: 12px;
        line-height: 1.8;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(10, 19, 39, 0.54);
        backdrop-filter: blur(7px);
      }
      .modal-backdrop.open {
        display: flex;
        animation: fade 0.18s ease both;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .modal {
        width: min(96vw, 1440px);
        max-height: 94vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #e8edf5;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 28px 90px rgba(8, 18, 40, 0.28);
        animation: modalUp 0.24s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes modalUp {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        padding: 12px 21px;
        border-bottom: 1px solid var(--line);
      }
      .modal-heading {
        margin: 0;
        font-size: 15px;
        font-weight: 800;
      }
      .icon-button {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        width: 35px;
        height: 35px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: #617087;
        font-size: 18px;
      }
      .icon-button:hover {
        background: #f4f6fa;
      }
      .modal-body {
        overflow: auto;
        padding: 23px;
      }
      .modal-foot {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
        padding: 14px 21px;
        border-top: 1px solid var(--line);
        background: #fcfcfd;
      }
      .form-grid {
        display: grid;
        gap: 17px;
      }
      .field label {
        display: block;
        margin: 0 0 8px;
        color: #4f5d75;
        font-size: 12px;
        font-weight: 750;
      }
      .field input,
      .field select {
        width: 100%;
        height: 45px;
        padding: 0 12px;
        outline: 0;
        border: 1px solid #dfe5ee;
        border-radius: 10px;
        background: #fff;
      }
      .field input:focus,
      .field select:focus {
        border-color: #7894cf;
        box-shadow: 0 0 0 3px #163c8912;
      }
      .danger {
        margin-right: auto;
        border-color: #f1cfd2;
        color: #bb3541;
      }
      .danger:hover {
        border-color: #e9aeb4;
        color: #a41d2a;
        background: #fff8f8;
      }
      .preview-frame {
        width: 100%;
        min-height: 72vh;
        border: 0;
        background: #f4f6f9;
      }
      .preview-file {
        min-height: 48vh;
        display: grid;
        place-items: center;
        padding: 28px;
        text-align: center;
        background: #f7f8fb;
      }
      .preview-file p {
        color: #788397;
        font-size: 13px;
        line-height: 1.8;
      }
      .qr-layout {
        display: grid;
        grid-template-columns: 380px minmax(0, 1fr);
        align-items: center;
        gap: 25px;
        padding: 10px 4px;
      }
      .qr-box {
        display: grid;
        place-items: center;
        width: min(100%, 380px);
        aspect-ratio: 1;
        padding: 15px;
        border: 1px solid #ebeff5;
        border-radius: 16px;
        background: #fff;
      }
      .qr-box img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        image-rendering: pixelated;
      }
      .qr-fallback {
        padding: 16px;
        text-align: center;
        color: #8b95a4;
        font-size: 11px;
      }
      .share-copy h3 {
        margin: 0 0 9px;
        font-size: 17px;
      }
      .share-copy p {
        margin: 0 0 15px;
        color: #7c8799;
        font-size: 12px;
        line-height: 1.75;
      }
      .share-url {
        overflow-wrap: anywhere;
        padding: 10px;
        border-radius: 9px;
        background: #f4f6fa;
        color: #59677f;
        font:
          11px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .qr-mode-note {
        margin: 10px 0 0;
        color: #7c8799;
        font-size: 11px;
        line-height: 1.7;
      }
      .toast {
        position: fixed;
        z-index: 200;
        right: 22px;
        bottom: 22px;
        max-width: calc(100vw - 44px);
        padding: 13px 17px;
        border-radius: 12px;
        background: #182844;
        color: #fff;
        box-shadow: var(--shadow);
        font-size: 12px;
        opacity: 0;
        transform: translateY(8px);
        pointer-events: none;
        transition: 0.22s;
      }
      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }
      .menu-button {
        display: none;
      }
      @media (min-width: 1300px) {
        .hero-mark {
          display: block;
        }
      }
      @media (max-width: 920px) {
        .layout {
          grid-template-columns: 210px minmax(0, 1fr);
        }
        .sidebar {
          padding-left: 17px;
          padding-right: 15px;
        }
        .content {
          padding-left: 30px;
          padding-right: 30px;
        }
        .tool-card {
          grid-template-columns: minmax(0, 1fr);
          gap: 14px;
        }
        .tool-meta {
          grid-column: auto;
          grid-row: auto;
          margin-left: 0;
        }
        .card-actions {
          grid-column: auto;
          grid-row: auto;
        }
      }
      @media (orientation: landscape) and (min-width: 921px) and (max-width: 1366px) and (pointer: coarse) {
        .tool-card {
          grid-template-columns: minmax(0, 1fr);
          gap: 14px;
        }
        .card-actions {
          grid-column: auto;
          grid-row: auto;
        }
      }
      @media (max-width: 680px) {
        .topbar {
          height: 64px;
          padding: 0 17px;
        }
        .brand {
          min-width: 0;
          gap: 9px;
        }
        .brand img {
          width: 100px;
          max-height: 38px;
        }
        .brand-name,
        .brand-divider {
          display: none;
        }
        .top-meta {
          display: flex;
          gap: 7px;
          font-size: 10px;
        }
        .menu-button {
          display: grid;
          place-items: center;
          width: 38px;
          height: 38px;
          border: 1px solid var(--line);
          border-radius: 11px;
          background: #fff;
          color: var(--blue);
        }
        .layout {
          display: block;
          min-height: calc(100vh - 64px);
        }
        .sidebar {
          display: block;
          padding: 13px 16px 10px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
          background: #fff;
        }
        .side-kicker,
        .sidebar-bottom,
        .local-note {
          display: none;
        }
        .nav-list {
          display: flex;
          overflow-x: auto;
          gap: 6px;
          scrollbar-width: none;
        }
        .nav-list::-webkit-scrollbar {
          display: none;
        }
        .nav-item {
          flex: 0 0 auto;
          width: auto;
          min-height: 39px;
          padding: 0 11px;
          gap: 7px;
          border: 1px solid transparent;
          font-size: 12px;
        }
        .nav-item.active {
          border-color: #e0e8f6;
        }
        .nav-icon {
          width: 20px;

            refreshConnectionState();
          },
          (error) => {
            console.error("Firebase connection status error:", error);
            databaseConnected = false;
            refreshConnectionState();
          },
        );
        onValue(
          sharedToolsRef,
          (snapshot) => {
            const value = snapshot.val() || {};
            sharedLinks = Object.entries(value)
              .map(([key, item]) => ({
                ...item,
                id: String(key),
                type: "url",
              }))
              .filter(
                (item) =>
                  item.title &&
                  item.url &&
                  CATEGORIES.includes(item.category) &&
                  item.category !== "すべて",
              );
            initialDataLoaded = true;
            firebaseReadError = false;
            render();
            refreshConnectionState();
          },
          (error) => {
            console.error("Firebase data read failed:", error);
            initialDataLoaded = true;
            firebaseReadError = true;
            sharedLinks = [];
            render();
            refreshConnectionState();
            showToast(
              "Firebaseを読み込めません。接続先URLとDatabase Rulesを確認してください。",
            );
          },
        );
      }
      function refreshConnectionState() {
        if (!navigator.onLine || databaseConnected === false) {
          setConnectionState("offline");
        } else if (
          databaseConnected === null ||
          !initialDataLoaded ||
          firebaseReadError
        ) {
          setConnectionState("syncing");
        } else {
          setConnectionState("online");
        }
      }
      function prettyDate(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "日付不明";
        return new Intl.DateTimeFormat("ja-JP", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }).format(date);
      }
      function renderCategories() {
        const items = allItems();
        $("#categoryNav").innerHTML = CATEGORIES.map((category) => {
          const count =
            category === "すべて"
              ? items.length
              : items.filter((item) => item.category === category).length;
          return `<button class="nav-item ${selectedCategory === category ? "active" : ""}"
          data-category="${escapeHtml(category)}" aria-pressed="${selectedCategory === category}">
          <span class="nav-icon"><img src="${CATEGORY_LOGOS[category]}" alt="" /></span>
          <span>${escapeHtml(category)}</span>
          <span class="nav-count">${count}</span></button>`;
        }).join("");
      }
      function getVisibleItems() {
        const query = normalized($("#search").value.trim());
        let items = allItems().filter(
          (item) =>
            selectedCategory === "すべて" || item.category === selectedCategory,
        );
        if (query)
          items = items.filter((item) =>
            normalized(item.title).includes(query),
          );
        if ($("#sortSelect").value === "name")
          items.sort((a, b) => a.title.localeCompare(b.title, "ja"));
        else
          items.sort(
            (a, b) => new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0),
          );
        return items;
      }
      function render() {
        renderCategories();
        const items = getVisibleItems();
        $("#resultsTitle").textContent =
          selectedCategory === "すべて"
            ? "すべてのツール"
            : `${selectedCategory}のツール`;
        $("#resultCount").textContent = `${items.length} 件`;
        $("#toolList").innerHTML = items
          .map((item, index) => {
            const isFile = item.type === "file";
            const ext = isFile
              ? (item.extension || "FILE").toUpperCase()
              : "WEB";
            return `<article class="tool-card" style="animation-delay:${Math.min(index * 35, 210)}ms">
          <div class="tool-main"><div class="tool-title-row">
            <span class="type-icon">${escapeHtml(ext.slice(0, 4))}</span>
            <span class="tool-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</span>
          </div>
          <div class="tool-meta">
            <span class="tag">${escapeHtml(item.category)}</span>
            <span class="tool-kind">${isFile ? `${escapeHtml(ext)} ファイル` : "Webサイト"}</span>
            <span class="date">更新 ${escapeHtml(prettyDate(item.updatedAt))}</span>
          </div></div>
          <div class="card-actions">
            <button class="action" data-action="edit" data-id="${escapeHtml(item.id)}">編集</button>
            <button class="action" data-action="preview" data-id="${escapeHtml(item.id)}">プレビュー</button>
            <a class="action primary" data-action="open" data-id="${escapeHtml(item.id)}"
              href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">開く ↗</a>
            <button class="action" data-action="share" data-id="${escapeHtml(item.id)}">お渡し</button>
          </div>
        </article>`;
          })
          .join("");
        const empty = items.length === 0;
        $("#emptyState").classList.toggle("show", empty);
        $("#emptyTitle").textContent = $("#search").value.trim()
          ? "一致するツールがありません"
          : "ツールはまだありません";
        $("#emptyText").textContent = $("#search").value.trim()
          ? "別のキーワードで検索するか、カテゴリを切り替えてください。"
          : "「URLを新規追加」からWebツールを登録するか、READMEの手順で資料ファイルを追加してください。";
      }
      function openModal(title, body, footer = "") {
        $("#modalTitle").textContent = title;
        $("#modalBody").innerHTML = body;
        $("#modalFoot").innerHTML = footer;
        $("#modalBackdrop").classList.add("open");
        document.body.style.overflow = "hidden";
        $("#modal").focus();
      }
      function closeModal() {
        $("#modalBackdrop").classList.remove("open");
        document.body.style.overflow = "";
        $("#modalBody").innerHTML = "";
        activeModalItem = null;
      }
      function categoryOptions(selected = "家電") {
        return CATEGORIES.filter((value) => value !== "すべて")
          .map(
            (value) =>
              `<option value="${escapeHtml(value)}" ${value === selected ? "selected" : ""}>${escapeHtml(value)}</option>`,
          )
          .join("");
      }
      function openEditor(item = null) {
        activeModalItem = item;
        const editing = Boolean(item);
        const body = `<form class="form-grid" id="linkForm">
        <div class="field"><label for="linkTitle">ツールの題名</label>
          <input id="linkTitle" name="title" required maxlength="100"
            value="${escapeHtml(item?.title || "")}"
            placeholder="例：エアコン選びサポート"></div>
        <div class="field"><label for="linkUrl">URL</label>
          <input id="linkUrl" name="url" type="url" required value="${escapeHtml(item?.url || "")}" placeholder="https://example.com"></div>
        <div class="field"><label for="linkCategory">ラベル</label>
          <select id="linkCategory" name="category">${categoryOptions(item?.category || "家電")}</select></div>
      </form>`;
        const footer = `${editing ? '<button class="action danger" id="deleteLink">削除</button>' : ""}
        <button class="action" id="cancelModal">キャンセル</button>
        <button class="action primary" id="saveLink">${editing ? "変更を確定" : "登録する"}</button>`;
        openModal(editing ? "URLを編集" : "Webツールを追加", body, footer);
      }
      function openFileEditInfo(item) {
        const body = `<div class="form-grid">
          <p>この資料ファイルはGitHubリポジトリで管理されています。この画面からファイル本体を直接変更することはできません。</p>
          <div class="field"><label>分類</label><div class="share-url">${escapeHtml(item.category)}</div></div>
          <div class="field"><label>ファイルの場所</label><div class="share-url">${escapeHtml(item.url)}</div></div>
          <p>変更する場合はリポジトリ内のファイルを差し替えてください。題名や更新日を指定したい場合は<code>files/catalog.json</code>に補助情報を登録できます。</p>
        </div>`;
        openModal(
          "ファイル資料の編集方法",
          body,
          '<button class="action primary" id="cancelModal">閉じる</button>',
        );
      }
      function showToast(message) {
        const toast = $("#toast");
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
      }
      function itemById(id) {
        return allItems().find((item) => String(item.id) === String(id));
      }
      function safeUrl(value) {
        try {
          const url = new URL(value);
          return ["http:", "https:"].includes(url.protocol) ? url.href : null;
        } catch {
          return null;
        }
      }
      function preview(item) {
        activeModalItem = item;
        const file = item.type === "file";
        const previewBody = file
          ? [
              "pdf",
              "html",
              "htm",
              "png",
              "jpg",
              "jpeg",
              "webp",
              "txt",
            ].includes((item.extension || "").toLowerCase())
            ? `<iframe class="preview-frame" title="${escapeHtml(item.title)}" src="${escapeHtml(item.url)}"></iframe>`
            : `<div class="preview-file"><div><div class="empty-icon">${escapeHtml((item.extension || "FILE").toUpperCase())}</div>
              <p>この形式はブラウザ内プレビューに対応していません。<br>「別タブで開く」からご確認ください。</p>
              <a class="action primary" href="${escapeHtml(item.url)}" target="_blank" rel="noopener">別タブで開く ↗</a></div></div>`
          : `<iframe class="preview-frame" title="${escapeHtml(item.title)}" src="${escapeHtml(item.url)}"
            sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-downloads" referrerpolicy="no-referrer"></iframe>`;
        openModal(
          item.title,
          previewBody,
          `<a class="action primary" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">別タブで開く ↗</a>
         <button class="action" id="cancelModal">閉じる</button>`,
        );
      }
      function createQrDataUri(value) {
        const code = qrcode(0, "L");
        code.addData(value, "Byte");
        code.make();
        const modules = code.getModuleCount();
        const margin = 4;
        let path = "";
        for (let row = 0; row < modules; row += 1) {
          for (let col = 0; col < modules; col += 1) {
            if (code.isDark(row, col))
              path += `M${col + margin},${row + margin}h1v1h-1z`;
          }
        }
        const size = modules + margin * 2;
        const svg = `<svg xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges">
          <path fill="#fff" d="M0 0h${size}v${size}H0z"/>
          <path fill="#14213d" d="${path}"/>
        </svg>`;
        return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      }
      function share(item) {
        const target =
          item.type === "file"
            ? new URL(item.url, location.href).href
            : item.url;
        const body = `<div class="qr-layout"><div class="qr-box" id="qrBox"><div class="qr-fallback">QRコードを準備しています…</div></div>
        <div class="share-copy"><h3>お客様へお渡し</h3>
          <p>${item.type === "file" ? "QRコードからファイルを開き、必要に応じてダウンロードできます。" : "QRコードからWebサイトを開けます。"}</p>
          <div class="share-url">${escapeHtml(target)}</div>
          <p id="qrModeNote" class="qr-mode-note"></p></div></div>`;
        openModal(
          "QRコードで共有",
          body,
          `<button class="action" id="copyShare">リンクをコピー</button><button class="action primary" id="cancelModal">閉じる</button>`,
        );
        try {
          let qrSrc;
          let usedRedirect = false;
          try {
            qrSrc = createQrDataUri(target);
          } catch (error) {
            if (item.type !== "url" || !item.id) throw error;
            const redirect = new URL(location.href);
            redirect.search = "";
            redirect.hash = "";
            redirect.searchParams.set("open", item.id);
            qrSrc = createQrDataUri(redirect.href);
            usedRedirect = true;
          }
          const img = document.createElement("img");
          img.alt = "共有先のQRコード";
          img.width = 350;
          img.height = 350;
          img.src = qrSrc;
          const box = $("#qrBox");
          if (box) box.replaceChildren(img);
          if (usedRedirect) {
            $("#qrModeNote").textContent =
              "長いURLのため、QRコードを読み取るとこのサイト経由で目的のページを開きます。";
          }
        } catch (error) {
          console.error("QR code generation failed:", error);
          const box = $("#qrBox");
          if (box)
            box.innerHTML =
              '<div class="qr-fallback">QRコードを作成できませんでした。ページを再読み込みしてください。下のリンクをコピーして共有できます。</div>';
        }
      }
      function askConfirmation(
        title,
        message,
        buttonLabel,
        action,
        danger = false,
      ) {
        const body = `<p style="margin:0;color:#68758b;font-size:13px;line-height:1.9">${escapeHtml(message)}</p>`;
        const buttonClass = danger ? "action danger" : "action primary";
        openModal(
          title,
          body,
          `<button class="action" id="cancelModal">キャンセル</button>
         <button class="${buttonClass}" id="confirmAccept">${escapeHtml(buttonLabel)}</button>`,
        );
        $("#confirmAccept").addEventListener("click", action);
      }
      async function loadFiles() {
        setConnectionState("syncing");
        let manifestRows = [];
        try {
          const response = await fetch(
            new URL("files/catalog.json", document.baseURI),
            { cache: "no-store" },
          );
          if (response.ok) {
            const rows = await response.json();
            if (Array.isArray(rows)) manifestRows = rows;
          }
        } catch (error) {
          console.warn("File catalog could not be loaded:", error);
        }

        const metadata = new Map(
          manifestRows.map((row) => [`${row.category}/${row.path}`, row]),
        );
        try {
          const repo = getGithubRepository();
          if (!repo) throw new Error("GitHub Pages repository not detected");
          const response = await fetch(
            `https://api.github.com/repos/${repo.owner}/${repo.name}/git/trees/HEAD?recursive=1`,
            { headers: { Accept: "application/vnd.github+json" } },
          );
          if (!response.ok)
            throw new Error(`GitHub API returned ${response.status}`);
          const tree = await response.json();
          const basePath = repo.basePath;
          const discovered = (tree.tree || [])
            .filter((entry) => entry.type === "blob")
            .map((entry) => {
              const match = entry.path.match(
                /^(?:files\/)?(家電|季節AV|情報|通信)\/(.+)$/,
              );
              const filename = match?.[2].split("/").pop() || "";
              if (
                !match ||
                filename === ".gitkeep" ||
                filename.toLowerCase() === "readme.md"
              )
                return null;
              const [, category, path] = match;
              const row = metadata.get(`${category}/${path}`) || {};
              const encodedPath = entry.path
                .split("/")
                .map(encodeURIComponent)
                .join("/");
              return {
                id: `file-${encodeURIComponent(entry.path)}`,
                type: "file",
                title: row.title || filename,
                category,
                url: `${basePath}${encodedPath}`,
                extension: (filename.split(".").pop() || "FILE").toLowerCase(),
                updatedAt: row.updatedAt || "",
              };
            })
            .filter(Boolean);
          fileItems = discovered.length
            ? discovered
            : makeManifestItems(manifestRows, repo.basePath);
        } catch (error) {
          console.warn("GitHub file scan failed; using catalog:", error);
          const basePath = getGithubRepository()?.basePath || "";
          fileItems = makeManifestItems(manifestRows, basePath);
          if (!fileItems.length && manifestRows.length === 0) {
            showToast(
              "資料一覧を取得できません。GitHub公開設定とfiles/catalog.jsonを確認してください。",
            );
          }
        }
        render();
      }

      function getGithubRepository() {
        const segments = location.pathname.split("/").filter(Boolean);
        if (GITHUB_REPOSITORY_OVERRIDE) {
          const [owner, name] = GITHUB_REPOSITORY_OVERRIDE.split("/");
          if (!owner || !name) return null;
          const basePath =
            segments[0] === name ? `/${encodeURIComponent(name)}/` : "/";
          return { owner, name, basePath };
        }
        const match = location.hostname.match(/^([^.]+)\.github\.io$/i);
        if (!match) return null;
        const owner = match[1];
        if (segments.length) {
          const name = segments[0];
          return {
            owner,
            name,
            basePath: `/${encodeURIComponent(name)}/`,
          };
        }
        return { owner, name: `${owner}.github.io`, basePath: "/" };
      }

      function makeManifestItems(rows, basePath = "") {
        return rows
          .filter(
            (row) =>
              row.path &&
              String(row.path).split("/").pop().toLowerCase() !== "readme.md" &&
              CATEGORIES.includes(row.category) &&
              row.category !== "すべて",
          )
          .map((row, index) => {
            const filename = String(row.path).split("/").pop();
            const encodedPath = String(row.path)
              .split("/")
              .map(encodeURIComponent)
              .join("/");
            return {
              id: `file-${index}-${row.category}-${row.path}`,
              type: "file",
              title: row.title || filename,
              category: row.category,
              url: `${basePath}files/${encodeURIComponent(row.category)}/${encodedPath}`,
              extension: (filename.split(".").pop() || "FILE").toLowerCase(),
              updatedAt: row.updatedAt || "",
            };
          });
      }

      function setConnectionState(state) {
        const dot = $("#connectionStatus .status-dot");
        const label = $("#connectionLabel");
        if (!dot || !label) return;
        const connection =
          navigator.connection ||
          navigator.mozConnection ||
          navigator.webkitConnection;
        if (
          state === "online" &&
          connection &&
          (["slow-2g", "2g"].includes(connection.effectiveType) ||
            (Number.isFinite(connection.downlink) && connection.downlink < 0.5))
        ) {
          state = "syncing";
        }
        dot.dataset.state = state;
        label.textContent = {
          online: "オンライン",
          syncing: "連携中",
          offline: "オフライン",
        }[state];
      }
      function redirectSharedUrlFromQr() {
        const id = new URL(location.href).searchParams.get("open");
        if (!id) return;
        if (!/^[A-Za-z0-9_-]{1,80}$/.test(id)) {
          showToast("共有リンクの形式が正しくありません。");
          return;
        }
        let unsubscribe = () => {};
        unsubscribe = onValue(
          ref(database, `sharedTools/${id}`),
          (snapshot) => {
            const destination = safeUrl(snapshot.val()?.url);
            if (destination) {
              unsubscribe();
              location.replace(destination);
            } else if (!snapshot.exists()) {
              unsubscribe();
              showToast(
                "共有先が見つかりません。リンクが削除された可能性があります。",
              );
            }
          },
          (error) => {
            console.error("QR redirect lookup failed:", error);
            setConnectionState("offline");
            showToast(
              "共有先を読み込めません。インターネット接続を確認してください。",
            );
          },
        );
      }

      $("#categoryNav").addEventListener("click", (event) => {
        const button = event.target.closest("[data-category]");
        if (!button) return;
        selectedCategory = button.dataset.category;
        render();
      });
      $("#search").addEventListener("input", render);
      $("#sortSelect").addEventListener("change", render);
      $("#homeLink").addEventListener("click", () => {
        selectedCategory = "すべて";
        $("#search").value = "";
        $("#sortSelect").value = "newest";
        render();
      });
      $("#addButton").addEventListener("click", () => openEditor());
      $("#mobileAdd").addEventListener("click", () => openEditor());
      $("#toolList").addEventListener("click", (event) => {
        const button = event.target.closest("[data-action]");
        if (!button) return;
        const item = itemById(button.dataset.id);
        if (!item) return;
        if (button.dataset.action === "preview") preview(item);
        if (button.dataset.action === "share") share(item);
        if (button.dataset.action === "edit") {
          if (item.type === "file") openFileEditInfo(item);
          else openEditor(item);
        }
      });
      $("#modalBackdrop").addEventListener("click", (event) => {
        if (event.target === $("#modalBackdrop")) closeModal();
        if (event.target.closest("#cancelModal")) closeModal();
        if (event.target.closest("#saveLink")) {
          event.preventDefault();
          const form = $("#linkForm");
          if (!form.reportValidity()) return;
          const data = new FormData(form);
          const url = safeUrl(data.get("url"));
          if (!url) {
            showToast("http:// または https:// で始まるURLを入力してください");
            return;
          }
          const editing = Boolean(activeModalItem);
          const oldId = activeModalItem?.id;
          const record = {
            id: oldId || `url-${Date.now()}`,
            type: "url",
            title: String(data.get("title")).trim(),
            url,
            category: data.get("category"),
            updatedAt: new Date().toISOString(),
          };
          askConfirmation(
            editing ? "変更内容の確認" : "登録内容の確認",
            editing
              ? "この内容に変更してよろしいですか？"
              : "このURLを登録してよろしいですか？",
            editing ? "変更を確定" : "登録する",
            async () => {
              try {
                await saveFirebaseLink(record, editing ? oldId : null);
                closeModal();
                showToast(
                  editing
                    ? "変更をFirebaseに保存しました"
                    : "URLをFirebaseに登録しました",
                );
              } catch (error) {
                console.error("Firebase save failed:", error);
                refreshConnectionState();
                showToast(
                  "Firebaseへの保存に失敗しました。Database Rulesと接続状態を確認してください。",
                );
              }
            },
          );
        }
        if (event.target.closest("#deleteLink")) {
          const item = activeModalItem;
          if (!item) return;
          askConfirmation(
            "削除の確認",
            `「${item.title}」を削除してよろしいですか？この操作は取り消せません。`,
            "削除する",
            async () => {
              try {
                await deleteFirebaseLink(item.id);
                closeModal();
                showToast("URLをFirebaseから削除しました");
              } catch (error) {
                console.error("Firebase delete failed:", error);
                refreshConnectionState();
                showToast(
                  "Firebaseからの削除に失敗しました。Database Rulesと接続状態を確認してください。",
                );
              }
            },
            true,
          );
        }
        if (event.target.closest("#copyShare")) {
          const url = $(".share-url")?.textContent || "";
          navigator.clipboard
            ?.writeText(url)
            .then(() => showToast("リンクをコピーしました"))
            .catch(() => showToast("リンクを選択してコピーしてください"));
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeModal();
      });
      window.addEventListener("offline", refreshConnectionState);
      window.addEventListener("online", refreshConnectionState);
      (
        navigator.connection ||
        navigator.mozConnection ||
        navigator.webkitConnection
      )?.addEventListener("change", refreshConnectionState);
      render();
      loadFiles();
      subscribeToFirebase();
      redirectSharedUrlFromQr();
      window.setTimeout(() => $("#boot").classList.add("done"), 2800);
    </script>
  </body>
</html>
